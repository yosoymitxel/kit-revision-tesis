# Servicios locales: Noplag Engine + SearXNG. No publicar estos puertos en Internet.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: noplag
      POSTGRES_PASSWORD: noplag-local-only
      POSTGRES_DB: noplag
    volumes:
      - noplag_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "noplag", "-d", "noplag"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  init-corpus:
    image: postgres:16
    command: ["chown", "-R", "1000:1000", "/var/lib/noplag/corpus"]
    volumes:
      - noplag_corpus_uploads:/var/lib/noplag/corpus
    restart: "no"

  engine:
    build:
      context: https://github.com/NoplagLabs/noplag-engine.git#main
    depends_on:
      postgres:
        condition: service_healthy
      init-corpus:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://noplag:noplag-local-only@postgres:5432/noplag
      CORPUS_STORAGE_DIR: /var/lib/noplag/corpus
      NOPLAG_LOAD_SAMPLE_CORPUS: "0"
      NOPLAG_TENANT_ID: "00000000-0000-4000-8000-000000000001"
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - noplag_corpus_uploads:/var/lib/noplag/corpus
    restart: unless-stopped

  valkey:
    image: docker.io/valkey/valkey:9-alpine
    command: ["valkey-server", "--save", "300", "1", "--save", "60", "1000", "--loglevel", "warning"]
    volumes:
      - searxng_valkey_data:/data
    restart: unless-stopped

  searxng:
    image: docker.io/searxng/searxng:latest
    depends_on:
      - valkey
    env_file:
      - .env.searxng
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8888/
      SEARXNG_LIMITER: "false"
      SEARXNG_IMAGE_PROXY: "false"
      SEARXNG_VALKEY_URL: valkey://valkey:6379/0
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng_data:/var/cache/searxng
    restart: unless-stopped

volumes:
  noplag_postgres_data:
  noplag_corpus_uploads:
  searxng_valkey_data:
  searxng_data:
