name: Tests antiplagio

on:
  push:
    branches: [main]
    paths:
      - "kit/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/test-antiplagio.yml"
  pull_request:
    paths:
      - "kit/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/test-antiplagio.yml"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pdfminer.six
      - name: Compile Python modules
        run: python -m compileall -q kit tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
